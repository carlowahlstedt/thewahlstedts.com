<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Wahlstedts</title>
  <meta name="description" content="Home of the Wahlstedts. Visit Carlo's or Amanda's site.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf8f4;
      --text: #1f1d1a;
      --muted: #6b665e;
      --card: #ffffff;
      --border: #e6e1d8;
      --carlo: #00a5ff;
      --amanda: #fc5a20;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161514;
        --text: #f1eee8;
        --muted: #a39d93;
        --card: #1f1e1c;
        --border: #34312d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, sans-serif;
    }
    header { text-align: center; margin-bottom: 40px; }
    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      font-size: clamp(2.25rem, 7vw, 3.5rem);
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    header p { margin: 0; color: var(--muted); font-size: 1.05rem; }
    main {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 640px;
    }
    a.site {
      display: block;
      padding: 28px 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-top: 4px solid var(--accent);
      border-radius: 12px;
      color: inherit;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    a.site:hover, a.site:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
      outline: none;
    }
    a.site h2 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      font-size: 1.6rem;
      margin: 0 0 6px;
    }
    a.site .url { color: var(--accent); font-size: 0.95rem; font-weight: 500; }
    .carlo { --accent: var(--carlo); }
    .amanda { --accent: var(--amanda); }
    footer { margin-top: 48px; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>
    <h1>The Wahlstedts</h1>
    <p>Pick a Wahlstedt.</p>
  </header>
  <main>
    <a class="site carlo" href="https://carlo.thewahlstedts.com">
      <h2>Carlo</h2>
      <span class="url">carlo.thewahlstedts.com &rarr;</span>
    </a>
    <a class="site amanda" href="https://amanda.thewahlstedts.com">
      <h2>Amanda</h2>
      <span class="url">amanda.thewahlstedts.com &rarr;</span>
    </a>
  </main>
  <footer>&copy; <script>document.write(new Date().getFullYear())</script> The Wahlstedts</footer>
</body>
</html>
