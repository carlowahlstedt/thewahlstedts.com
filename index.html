<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Wahlstedts</title>
  <meta name="description" content="Home of the Wahlstedts. Visit Carlo's, Amanda's, or Ephraim's site.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf8f4;
      --text: #1f1d1a;
      --muted: #6b665e;
      --card: #ffffff;
      --border: #e6e1d8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161514;
        --text: #f1eee8;
        --muted: #a39d93;
        --card: #1f1e1c;
        --border: #34312d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, sans-serif;
    }
    header { text-align: center; margin-bottom: 40px; }
    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      font-size: clamp(2.25rem, 7vw, 3.5rem);
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    header p { margin: 0; color: var(--muted); font-size: 1.05rem; }
    main {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 860px;
    }
    a.site {
      display: block;
      padding: 28px 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-top: 4px solid var(--accent, var(--border));
      border-radius: 12px;
      color: inherit;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    a.site:hover, a.site:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
      outline: none;
    }
    a.site h2 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      font-size: 1.6rem;
      margin: 0 0 6px;
    }
    a.site .avatar {
      display: block;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 14px;
    }
    a.site .tagline { margin: 0; color: var(--muted); font-size: 0.95rem; line-height: 1.45; }
    @media (max-width: 600px) {
      main { grid-template-columns: 1fr; }
      a.site:has(> .avatar) {
        display: grid;
        grid-template-columns: auto 1fr;
        column-gap: 16px;
        align-items: center;
        padding: 20px;
      }
      a.site:has(> .avatar) .avatar {
        grid-row: 1 / span 2;
        margin-bottom: 0;
      }
      a.site:has(> .avatar) h2 { grid-column: 2; align-self: end; }
      a.site:has(> .avatar) .tagline { grid-column: 2; align-self: start; }
    }
    footer { margin-top: 48px; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>
    <h1>The Wahlstedts</h1>
    <p>Pick a Wahlstedt.</p>
  </header>
  <main id="sites"></main>
  <script>
    // Each Wahlstedt publishes /wahlstedt.json at the root of their site.
    // sites.json lists the sites (with fallback name/color), cards.json is an
    // hourly cached copy of everyone's wahlstedt.json (see .github/workflows),
    // and a live fetch overrides the cache for sites that allow CORS.
    var main = document.getElementById("sites");

    function getJSON(url) {
      return fetch(url, { cache: "no-cache" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; });
    }

    // Standard CSS cursor keywords a card may use instead of an image.
    var CURSOR_KEYWORDS = ["auto", "default", "pointer", "crosshair", "help",
      "grab", "grabbing", "move", "text", "wait", "progress", "not-allowed",
      "zoom-in", "zoom-out", "cell", "copy", "alias", "context-menu"];

    // Turn a card's cursor/cursorHotspot into a CSS cursor value, or "".
    function cursorValue(info, base) {
      var value = info.cursor;
      if (typeof value !== "string" || !value.trim()) return "";
      var keyword = value.trim().toLowerCase();
      if (CURSOR_KEYWORDS.indexOf(keyword) !== -1) return keyword;
      var url;
      try { url = new URL(value, base); } catch (e) { return ""; }
      if (url.protocol !== "http:" && url.protocol !== "https:") return "";
      var css = 'url("' + url.href.replace(/["\\\n\r\f]/g, function (c) {
        return "\\" + c.charCodeAt(0).toString(16) + " ";
      }) + '")';
      var hot = info.cursorHotspot;
      if (Array.isArray(hot) && hot.length === 2 && hot.every(function (n) {
        return typeof n === "number" && isFinite(n) && n >= 0;
      })) {
        css += " " + hot[0] + " " + hot[1];
      }
      return css + ", pointer";
    }

    function addCard(site, cached) {
      var card = document.createElement("a");
      card.className = "site";
      card.href = site.base;
      var name = document.createElement("h2");
      var tagline = document.createElement("p");
      tagline.className = "tagline";
      card.appendChild(name);
      card.appendChild(tagline);
      main.appendChild(card);

      function render(info) {
        card.href = info.url ? new URL(info.url, site.base).href : site.base;
        card.style.setProperty("--accent", info.color || site.color);
        name.textContent = info.name || site.name;
        tagline.textContent = info.tagline || "";
        tagline.hidden = !info.tagline;
        card.style.cursor = "";
        card.style.cursor = cursorValue(info, site.base);
        var img = card.querySelector("img");
        if (!info.avatar) {
          if (img) img.remove();
          return;
        }
        if (!img) {
          img = document.createElement("img");
          img.className = "avatar";
          img.alt = "";
          img.onerror = function () { img.remove(); };
          card.insertBefore(img, name);
        }
        img.src = new URL(info.avatar, site.base).href;
      }

      render(cached || {});
      getJSON(new URL("wahlstedt.json", site.base).href).then(function (live) {
        if (live) render(live);
      });
    }

    Promise.all([getJSON("sites.json"), getJSON("cards.json")]).then(function (res) {
      var sites = res[0] || [];
      var cards = res[1] || {};
      sites.forEach(function (site) { addCard(site, cards[site.base]); });
    });
  </script>
  <footer>&copy; <script>document.write(new Date().getFullYear())</script> The Wahlstedts</footer>
</body>
</html>
