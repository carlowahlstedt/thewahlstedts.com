name: Fetch cards

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths: [sites.json, scripts/fetch_cards.py]

permissions:
  contents: write

concurrency: fetch-cards

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_cards.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain cards.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add cards.json
            git commit -m "Update cards.json"
            git push
          fi
